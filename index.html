<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>A-Frame Individual Assessment 01</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #info {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.45);
      color: #fff;
      font-family: Georgia, serif;
      font-size: 13px;
      padding: 7px 18px;
      border-radius: 20px;
      letter-spacing: 0.04em;
      pointer-events: none;
      opacity: 0.85;
    }
  </style>
</head>
<body>
<div id="info">WASD to move · Mouse to look around</div>

<a-scene fog="type: linear; color: #b8d8f0; near: 25; far: 70"
         shadow="type: pcfsoft; autoUpdate: true">

  <!-- ============================================================
       SKY & ATMOSPHERE
  ============================================================ -->
  <a-sky color="#87CEEB"></a-sky>

  <!-- Gradient sky bands -->
  <a-sphere position="0 0 0" radius="59" scale="-1 1 1"
            material="color: #c9e8f8; side: back; opacity: 0.35; transparent: true; shader: flat"></a-sphere>

  <!-- SUN DISC -->
  <a-sphere position="12 18 -45" radius="1.8"
            material="color: #fff8dc; emissive: #ffe066; emissiveIntensity: 1.2; shader: flat"></a-sphere>
  <!-- Sun glow halo -->
  <a-sphere position="12 18 -45" radius="2.8"
            material="color: #ffe88a; emissive: #ffcc33; emissiveIntensity: 0.5; opacity: 0.25; transparent: true; shader: flat"></a-sphere>
  <a-sphere position="12 18 -45" radius="4.2"
            material="color: #ffdd66; emissive: #ffbb00; emissiveIntensity: 0.2; opacity: 0.1; transparent: true; shader: flat"></a-sphere>

  <!-- LIGHTING -->
  <a-light type="directional" color="#FFF8CC" intensity="1.4"
           position="12 18 -5" cast-shadow="true"
           shadow-camera-left="-15" shadow-camera-right="15"
           shadow-camera-top="15" shadow-camera-bottom="-15"
           shadow-map-width="2048" shadow-map-height="2048"></a-light>
  <a-light type="ambient" color="#cce0f5" intensity="0.65"></a-light>
  <!-- Fill light from opposite side -->
  <a-light type="directional" color="#aaccff" intensity="0.3" position="-8 5 8"></a-light>

  <!-- ============================================================
       CLOUDS  (layered sphere clusters)
  ============================================================ -->
  <!-- Cloud 1 -->
  <a-sphere position="-8 9 -18" radius="1.6" material="color:#fff;opacity:0.92;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="-6.2 9.5 -18" radius="2.1" material="color:#fff;opacity:0.95;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="-4.5 9 -18" radius="1.7" material="color:#fff;opacity:0.90;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="-6.2 8.4 -18" radius="1.4" material="color:#f8f8f8;opacity:0.8;transparent:true;shader:flat"></a-sphere>
  <!-- Cloud 2 -->
  <a-sphere position="6 10.5 -22" radius="1.4" material="color:#fff;opacity:0.88;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="7.8 11 -22" radius="1.8" material="color:#fff;opacity:0.92;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="9.5 10.5 -22" radius="1.5" material="color:#fff;opacity:0.88;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="7.8 9.9 -22" radius="1.2" material="color:#f0f0f0;opacity:0.75;transparent:true;shader:flat"></a-sphere>
  <!-- Cloud 3 small -->
  <a-sphere position="0 8 -30" radius="1.1" material="color:#fff;opacity:0.7;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="1.5 8.4 -30" radius="1.4" material="color:#fff;opacity:0.75;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="3 8 -30" radius="1.1" material="color:#fff;opacity:0.7;transparent:true;shader:flat"></a-sphere>
  <!-- Cloud 4 far -->
  <a-sphere position="-15 11 -35" radius="1.8" material="color:#eef4ff;opacity:0.6;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="-13 11.5 -35" radius="2.2" material="color:#eef4ff;opacity:0.65;transparent:true;shader:flat"></a-sphere>
  <a-sphere position="-11 11 -35" radius="1.7" material="color:#eef4ff;opacity:0.6;transparent:true;shader:flat"></a-sphere>

  <!-- ============================================================
       DISTANT MOUNTAINS (layered for depth)
  ============================================================ -->
  <!-- Far range -->
  <a-cone position="-18 6 -38" radius-bottom="12" radius-top="0.3" height="14"
          material="color:#8faebf;opacity:0.5;transparent:true;roughness:1;shader:flat"></a-cone>
  <a-cone position="-5 5 -40" radius-bottom="10" radius-top="0.3" height="11"
          material="color:#9ab4c4;opacity:0.45;transparent:true;roughness:1;shader:flat"></a-cone>
  <a-cone position="10 5.5 -38" radius-bottom="11" radius-top="0.3" height="12"
          material="color:#8aa4b8;opacity:0.48;transparent:true;roughness:1;shader:flat"></a-cone>
  <a-cone position="24 4.5 -36" radius-bottom="9" radius-top="0.3" height="10"
          material="color:#96b0c0;opacity:0.42;transparent:true;roughness:1;shader:flat"></a-cone>
  <!-- Mid range - greener -->
  <a-cone position="-14 4 -28" radius-bottom="9" radius-top="0.3" height="9"
          material="color:#7a9e82;opacity:0.55;transparent:true;roughness:1;shader:flat"></a-cone>
  <a-cone position="0 3.5 -30" radius-bottom="8" radius-top="0.2" height="8"
          material="color:#6d9178;opacity:0.5;transparent:true;roughness:1;shader:flat"></a-cone>
  <a-cone position="16 3.8 -27" radius-bottom="8" radius-top="0.2" height="8.5"
          material="color:#7aa082;opacity:0.52;transparent:true;roughness:1;shader:flat"></a-cone>
  <!-- Snow caps -->
  <a-cone position="-18 13 -38" radius-bottom="2.5" radius-top="0.05" height="3"
          material="color:#e8eef5;opacity:0.7;transparent:true;shader:flat"></a-cone>
  <a-cone position="10 12.5 -38" radius-bottom="2.2" radius-top="0.05" height="2.5"
          material="color:#e8eef5;opacity:0.65;transparent:true;shader:flat"></a-cone>

  <!-- ============================================================
       GROUND LAYERS
  ============================================================ -->
  <!-- Base ground -->
  <a-plane rotation="-90 0 0" width="80" height="80"
           material="color:#3a7d44;roughness:0.95" shadow="receive:true"></a-plane>
  <!-- Grass overlay -->
  <a-plane rotation="-90 0 0" position="0 0.01 0" width="80" height="80"
           material="color:#4a9e56;opacity:0.35;transparent:true"></a-plane>
  <!-- Garden area inner -->
  <a-plane rotation="-90 0 0" position="0 0.02 0" width="9" height="9"
           material="color:#56a85e;opacity:0.5;transparent:true"></a-plane>
  <!-- Dirt border ring -->
  <a-plane rotation="-90 0 0" position="0 0.015 0" width="9.6" height="9.6"
           material="color:#8B6914;opacity:0.25;transparent:true"></a-plane>

  <!-- ============================================================
       PAVING PATH & TILES
  ============================================================ -->
  <!-- Main path from gate to table -->
  <a-box position="0 0.03 3.8"  width="1.3" height="0.06" depth="1.3" material="color:#d4c4a0;roughness:0.85"></a-box>
  <a-box position="0 0.03 2.3"  width="1.3" height="0.06" depth="1.3" material="color:#cfc09a;roughness:0.85"></a-box>
  <a-box position="0 0.03 0.8"  width="1.3" height="0.06" depth="1.3" material="color:#d4c4a0;roughness:0.85"></a-box>
  <a-box position="0 0.03 -0.7" width="1.3" height="0.06" depth="1.3" material="color:#cfc09a;roughness:0.85"></a-box>
  <a-box position="0 0.03 -2.2" width="1.3" height="0.06" depth="1.3" material="color:#d4c4a0;roughness:0.85"></a-box>
  <!-- Grout lines (thin dark strips) -->
  <a-box position="0 0.035 3.8"  width="1.31" height="0.01" depth="0.03" material="color:#a08860;shader:flat"></a-box>
  <a-box position="0 0.035 2.3"  width="1.31" height="0.01" depth="0.03" material="color:#a08860;shader:flat"></a-box>
  <a-box position="0 0.035 0.8"  width="1.31" height="0.01" depth="0.03" material="color:#a08860;shader:flat"></a-box>
  <!-- Side accent tiles -->
  <a-box position="-0.7 0.03 3.1" width="0.5" height="0.05" depth="0.5" material="color:#bfaa88;roughness:0.9"></a-box>
  <a-box position="0.7 0.03 3.1"  width="0.5" height="0.05" depth="0.5" material="color:#bfaa88;roughness:0.9"></a-box>
  <a-box position="-0.7 0.03 1.6" width="0.5" height="0.05" depth="0.5" material="color:#bfaa88;roughness:0.9"></a-box>
  <a-box position="0.7 0.03 1.6"  width="0.5" height="0.05" depth="0.5" material="color:#bfaa88;roughness:0.9"></a-box>

  <!-- ============================================================
       TABLE (detailed)
  ============================================================ -->
  <!-- Tablecloth base -->
  <a-box position="0 0.805 0" width="2.25" height="0.02" depth="1.25"
         material="color:#fffaf0;roughness:0.95"></a-box>
  <!-- Tablecloth overhang sides -->
  <a-box position="0 0.77 0.63" width="2.05" height="0.07" depth="0.05"
         material="color:#fffaf0;roughness:0.95"></a-box>
  <a-box position="0 0.77 -0.63" width="2.05" height="0.07" depth="0.05"
         material="color:#fffaf0;roughness:0.95"></a-box>
  <a-box position="1.13 0.77 0" width="0.05" height="0.07" depth="1.26"
         material="color:#fffaf0;roughness:0.95"></a-box>
  <a-box position="-1.13 0.77 0" width="0.05" height="0.07" depth="1.26"
         material="color:#fffaf0;roughness:0.95"></a-box>
  <!-- Table top -->
  <a-box position="0 0.76 0" width="2.2" height="0.1" depth="1.2"
         material="color:#8B4513;roughness:0.55" shadow="cast:true;receive:true"></a-box>
  <!-- Wood grain strips on table -->
  <a-box position="-0.5 0.815 0" width="0.05" height="0.01" depth="1.18"
         material="color:#7a3c0f;opacity:0.5;transparent:true;shader:flat"></a-box>
  <a-box position="0 0.815 0" width="0.05" height="0.01" depth="1.18"
         material="color:#7a3c0f;opacity:0.5;transparent:true;shader:flat"></a-box>
  <a-box position="0.5 0.815 0" width="0.05" height="0.01" depth="1.18"
         material="color:#7a3c0f;opacity:0.5;transparent:true;shader:flat"></a-box>
  <!-- Table apron (skirt below top) -->
  <a-box position="0 0.67 -0.54" width="1.9" height="0.08" depth="0.04"
         material="color:#6B3410;roughness:0.7"></a-box>
  <a-box position="0 0.67 0.54" width="1.9" height="0.08" depth="0.04"
         material="color:#6B3410;roughness:0.7"></a-box>
  <a-box position="-0.97 0.67 0" width="0.04" height="0.08" depth="1.0"
         material="color:#6B3410;roughness:0.7"></a-box>
  <a-box position="0.97 0.67 0" width="0.04" height="0.08" depth="1.0"
         material="color:#6B3410;roughness:0.7"></a-box>
  <!-- Table legs (tapered look with 2 boxes each) -->
  <a-box position="-0.9 0.35 -0.45" width="0.1" height="0.7" depth="0.1"
         material="color:#6B3410;roughness:0.7" shadow="cast:true"></a-box>
  <a-box position="0.9 0.35 -0.45"  width="0.1" height="0.7" depth="0.1"
         material="color:#6B3410;roughness:0.7" shadow="cast:true"></a-box>
  <a-box position="-0.9 0.35 0.45"  width="0.1" height="0.7" depth="0.1"
         material="color:#6B3410;roughness:0.7" shadow="cast:true"></a-box>
  <a-box position="0.9 0.35 0.45"   width="0.1" height="0.7" depth="0.1"
         material="color:#6B3410;roughness:0.7" shadow="cast:true"></a-box>
  <!-- Leg foot caps -->
  <a-box position="-0.9 0.015 -0.45" width="0.12" height="0.03" depth="0.12" material="color:#4a2208"></a-box>
  <a-box position="0.9 0.015 -0.45"  width="0.12" height="0.03" depth="0.12" material="color:#4a2208"></a-box>
  <a-box position="-0.9 0.015 0.45"  width="0.12" height="0.03" depth="0.12" material="color:#4a2208"></a-box>
  <a-box position="0.9 0.015 0.45"   width="0.12" height="0.03" depth="0.12" material="color:#4a2208"></a-box>

  <!-- ============================================================
       CHAIRS (2 detailed)
  ============================================================ -->
  <!-- === CHAIR LEFT === -->
  <!-- Seat cushion -->
  <a-box position="-1.55 0.54 0" width="0.68" height="0.08" depth="0.68"
         material="color:#c8956a;roughness:0.85" shadow="cast:true"></a-box>
  <!-- Cushion piping border -->
  <a-box position="-1.55 0.585 0.34" width="0.68" height="0.02" depth="0.02"
         material="color:#a86040;roughness:0.7"></a-box>
  <a-box position="-1.55 0.585 -0.34" width="0.68" height="0.02" depth="0.02"
         material="color:#a86040;roughness:0.7"></a-box>
  <!-- Seat frame -->
  <a-box position="-1.55 0.49 0" width="0.72" height="0.06" depth="0.72"
         material="color:#5c3317;roughness:0.7"></a-box>
  <!-- Back rest -->
  <a-box position="-1.55 0.92 -0.32" width="0.7" height="0.72" depth="0.07"
         material="color:#5c3317;roughness:0.7" shadow="cast:true"></a-box>
  <!-- Back rest cushion -->
  <a-box position="-1.55 0.92 -0.285" width="0.62" height="0.60" depth="0.04"
         material="color:#c8956a;roughness:0.85"></a-box>
  <!-- Back uprights -->
  <a-box position="-1.18 0.7 -0.32" width="0.05" height="0.85" depth="0.05"
         material="color:#4a2810;roughness:0.7"></a-box>
  <a-box position="-1.92 0.7 -0.32" width="0.05" height="0.85" depth="0.05"
         material="color:#4a2810;roughness:0.7"></a-box>
  <!-- Back horizontal slats -->
  <a-box position="-1.55 0.78 -0.32" width="0.62" height="0.04" depth="0.05"
         material="color:#5c3317;roughness:0.7"></a-box>
  <a-box position="-1.55 0.96 -0.32" width="0.62" height="0.04" depth="0.05"
         material="color:#5c3317;roughness:0.7"></a-box>
  <a-box position="-1.55 1.14 -0.32" width="0.62" height="0.04" depth="0.05"
         material="color:#5c3317;roughness:0.7"></a-box>
  <!-- Chair legs -->
  <a-box position="-1.21 0.22 0.30"  width="0.06" height="0.44" depth="0.06" material="color:#3e2208" shadow="cast:true"></a-box>
  <a-box position="-1.89 0.22 0.30"  width="0.06" height="0.44" depth="0.06" material="color:#3e2208" shadow="cast:true"></a-box>
  <a-box position="-1.21 0.22 -0.30" width="0.06" height="0.44" depth="0.06" material="color:#3e2208" shadow="cast:true"></a-box>
  <a-box position="-1.89 0.22 -0.30" width="0.06" height="0.44" depth="0.06" material="color:#3e2208" shadow="cast:true"></a-box>
  <!-- Leg stretchers -->
  <a-box position="-1.55 0.18 0.30"  width="0.62" height="0.035" depth="0.035" material="color:#3e2208"></a-box>
  <a-box position="-1.55 0.18 -0.30" width="0.62" height="0.035" depth="0.035" material="color:#3e2208"></a-box>
  <a-box position="-1.21 0.18 0"     width="0.035" height="0.035" depth="0.55" material="color:#3e2208"></a-box>
  <a-box position="-1.89 0.18 0"     width="0.035" height="0.035" depth="0.55" material="color:#3e2208"></a-box>
  <!-- Foot caps -->
  <a-box position="-1.21 0.015 0.30"  width="0.08" height="0.03" depth="0.08" material="color:#2a1408"></a-box>
  <a-box position="-1.89 0.015 0.30"  width="0.08" height="0.03" depth="0.08" material="color:#2a1408"></a-box>
  <a-box position="-1.21 0.015 -0.30" width="0.08" height="0.03" depth="0.08" material="color:#2a1408"></a-box>
  <a-box position="-1.89 0.015 -0.30" width="0.08" height="0.03" depth="0.08" material="color:#2a1408"></a-box>

  <!-- === CHAIR RIGHT === -->
  <a-box position="1.55 0.54 0" width="0.68" height="0.08" depth="0.68"
         material="color:#c8956a;roughness:0.85" shadow="cast:true"></a-box>
  <a-box position="1.55 0.585 0.34" width="0.68" height="0.02" depth="0.02"
         material="color:#a86040;roughness:0.7"></a-box>
  <a-box position="1.55 0.585 -0.34" width="0.68" height="0.02" depth="0.02"
         material="color:#a86040;roughness:0.7"></a-box>
  <a-box position="1.55 0.49 0" width="0.72" height="0.06" depth="0.72"
         material="color:#5c3317;roughness:0.7"></a-box>
  <a-box position="1.55 0.92 0.32" width="0.7" height="0.72" depth="0.07"
         material="color:#5c3317;roughness:0.7" shadow="cast:true"></a-box>
  <a-box position="1.55 0.92 0.285" width="0.62" height="0.60" depth="0.04"
         material="color:#c8956a;roughness:0.85"></a-box>
  <a-box position="1.21 0.7 0.32" width="0.05" height="0.85" depth="0.05"
         material="color:#4a2810;roughness:0.7"></a-box>
  <a-box position="1.89 0.7 0.32" width="0.05" height="0.85" depth="0.05"
         material="color:#4a2810;roughness:0.7"></a-box>
  <a-box position="1.55 0.78 0.32" width="0.62" height="0.04" depth="0.05"
         material="color:#5c3317;roughness:0.7"></a-box>
  <a-box position="1.55 0.96 0.32" width="0.62" height="0.04" depth="0.05"
         material="color:#5c3317;roughness:0.7"></a-box>
  <a-box position="1.55 1.14 0.32" width="0.62" height="0.04" depth="0.05"
         material="color:#5c3317;roughness:0.7"></a-box>
  <a-box position="1.21 0.22 0.30"  width="0.06" height="0.44" depth="0.06" material="color:#3e2208" shadow="cast:true"></a-box>
  <a-box position="1.89 0.22 0.30"  width="0.06" height="0.44" depth="0.06" material="color:#3e2208" shadow="cast:true"></a-box>
  <a-box position="1.21 0.22 -0.30" width="0.06" height="0.44" depth="0.06" material="color:#3e2208" shadow="cast:true"></a-box>
  <a-box position="1.89 0.22 -0.30" width="0.06" height="0.44" depth="0.06" material="color:#3e2208" shadow="cast:true"></a-box>
  <a-box position="1.55 0.18 0.30"  width="0.62" height="0.035" depth="0.035" material="color:#3e2208"></a-box>
  <a-box position="1.55 0.18 -0.30" width="0.62" height="0.035" depth="0.035" material="color:#3e2208"></a-box>
  <a-box position="1.21 0.18 0"     width="0.035" height="0.035" depth="0.55" material="color:#3e2208"></a-box>
  <a-box position="1.89 0.18 0"     width="0.035" height="0.035" depth="0.55" material="color:#3e2208"></a-box>
  <a-box position="1.21 0.015 0.30"  width="0.08" height="0.03" depth="0.08" material="color:#2a1408"></a-box>
  <a-box position="1.89 0.015 0.30"  width="0.08" height="0.03" depth="0.08" material="color:#2a1408"></a-box>
  <a-box position="1.21 0.015 -0.30" width="0.08" height="0.03" depth="0.08" material="color:#2a1408"></a-box>
  <a-box position="1.89 0.015 -0.30" width="0.08" height="0.03" depth="0.08" material="color:#2a1408"></a-box>

  <!-- ============================================================
       TABLE ITEMS
  ============================================================ -->

  <!-- === MILO TIN === -->
  <!-- Can body -->
  <a-cylinder position="-0.52 0.985 0.1" radius="0.13" height="0.33"
              material="color:#2d6a1f;roughness:0.45" shadow="cast:true"></a-cylinder>
  <!-- Label band green -->
  <a-cylinder position="-0.52 0.985 0.1" radius="0.132" height="0.19"
              material="color:#1e4f14;roughness:0.5;opacity:0.9;transparent:true"></a-cylinder>
  <!-- Label text strip (lighter) -->
  <a-cylinder position="-0.52 0.985 0.1" radius="0.133" height="0.06"
              material="color:#f5e642;roughness:0.4;opacity:0.85;transparent:true"></a-cylinder>
  <!-- Lid -->
  <a-cylinder position="-0.52 1.158 0.1" radius="0.135" height="0.045"
              material="color:#4a3800;roughness:0.35"></a-cylinder>
  <!-- Lid ridge -->
  <a-torus position="-0.52 1.135 0.1" radius="0.132" radius-tubular="0.005"
           rotation="90 0 0" material="color:#333000;roughness:0.5"></a-torus>
  <!-- Bottom rim -->
  <a-cylinder position="-0.52 0.82 0.1" radius="0.133" height="0.015"
              material="color:#4a3800;roughness:0.4"></a-cylinder>

  <!-- === MILK TIN (evaporated milk style) === -->
  <a-cylinder position="-0.12 0.965 -0.2" radius="0.1" height="0.29"
              material="color:#f2f2f2;roughness:0.35" shadow="cast:true"></a-cylinder>
  <!-- Label (blue band) -->
  <a-cylinder position="-0.12 0.955 -0.2" radius="0.102" height="0.16"
              material="color:#2255aa;roughness:0.4;opacity:0.9;transparent:true"></a-cylinder>
  <!-- White stripe on label -->
  <a-cylinder position="-0.12 0.955 -0.2" radius="0.1025" height="0.04"
              material="color:#ffffff;roughness:0.3;opacity:0.8;transparent:true"></a-cylinder>
  <!-- Lid -->
  <a-cylinder position="-0.12 1.115 -0.2" radius="0.104" height="0.04"
              material="color:#cccccc;roughness:0.35"></a-cylinder>
