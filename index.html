<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Frame Individual Assessment 01</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    AFRAME.registerComponent('wheel-zoom', {
      schema: {
        min: {type: 'number', default: 1.4},
        max: {type: 'number', default: 8},
        speed: {type: 'number', default: 0.002}
      },
      init: function () {
        this.onWheel = this.onWheel.bind(this);
        window.addEventListener('wheel', this.onWheel, {passive: false});
      },
      remove: function () {
        window.removeEventListener('wheel', this.onWheel);
      },
      onWheel: function (evt) {
        evt.preventDefault();
        const pos = this.el.getAttribute('position');
        const nextZ = Math.min(this.data.max, Math.max(this.data.min, pos.z + (evt.deltaY * this.data.speed)));
        this.el.setAttribute('position', {x: pos.x, y: pos.y, z: nextZ});
      }
    });
  </script>
</head>
<body>
  <a-scene>
    <a-sky color="#BEE6FF"></a-sky>

    <a-entity light="type: ambient; intensity: 0.5"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="2 6 3"></a-entity>

    <a-plane
      rotation="-90 0 0"
      width="30"
      height="30"
      color="#6CA66C">
    </a-plane>

    <a-plane
      position="0 0.01 0"
      rotation="-90 0 0"
      width="8"
      height="8"
      color="#DDDDDD">
    </a-plane>

    <!-- Table -->
    <a-box position="0 1 0" width="2.6" height="0.15" depth="1.5" color="#8B5A2B"></a-box>
    <a-cylinder position="-1.15 0.5 -0.6" radius="0.07" height="1" color="#6F4518"></a-cylinder>
    <a-cylinder position="1.15 0.5 -0.6" radius="0.07" height="1" color="#6F4518"></a-cylinder>
    <a-cylinder position="-1.15 0.5 0.6" radius="0.07" height="1" color="#6F4518"></a-cylinder>
    <a-cylinder position="1.15 0.5 0.6" radius="0.07" height="1" color="#6F4518"></a-cylinder>

    <!-- Chair 1 -->
    <a-box position="-1.2 0.52 1.45" width="0.8" height="0.08" depth="0.8" color="#444"></a-box>
    <a-box position="-1.2 0.95 1.82" width="0.8" height="0.8" depth="0.08" color="#555"></a-box>
    <a-cylinder position="-1.52 0.25 1.13" radius="0.04" height="0.5" color="#333"></a-cylinder>
    <a-cylinder position="-0.88 0.25 1.13" radius="0.04" height="0.5" color="#333"></a-cylinder>
    <a-cylinder position="-1.52 0.25 1.77" radius="0.04" height="0.5" color="#333"></a-cylinder>
    <a-cylinder position="-0.88 0.25 1.77" radius="0.04" height="0.5" color="#333"></a-cylinder>

    <!-- Chair 2 -->
    <a-box position="1.2 0.52 1.45" width="0.8" height="0.08" depth="0.8" color="#444"></a-box>
    <a-box position="1.2 0.95 1.82" width="0.8" height="0.8" depth="0.08" color="#555"></a-box>
    <a-cylinder position="0.88 0.25 1.13" radius="0.04" height="0.5" color="#333"></a-cylinder>
    <a-cylinder position="1.52 0.25 1.13" radius="0.04" height="0.5" color="#333"></a-cylinder>
    <a-cylinder position="0.88 0.25 1.77" radius="0.04" height="0.5" color="#333"></a-cylinder>
    <a-cylinder position="1.52 0.25 1.77" radius="0.04" height="0.5" color="#333"></a-cylinder>

    <!-- MiLo tin -->
    <a-cylinder position="-0.45 1.22 -0.15" radius="0.16" height="0.42" color="#1F7A3A"></a-cylinder>
    <a-circle position="-0.45 1.43 -0.15" radius="0.16" rotation="-90 0 0" color="#D8B579"></a-circle>
    <a-entity
      position="-0.45 1.22 0.02"
      text="value: MiLo; align: center; color: #FFFFFF; width: 1.6">
    </a-entity>

    <!-- Milk tin -->
    <a-cylinder position="0.05 1.22 -0.15" radius="0.15" height="0.38" color="#F2F2F2"></a-cylinder>
    <a-circle position="0.05 1.41 -0.15" radius="0.15" rotation="-90 0 0" color="#DDD"></a-circle>
    <a-entity
      position="0.05 1.22 0.02"
      text="value: MILK; align: center; color: #1A1A1A; width: 1.4">
    </a-entity>

    <!-- Cup 1 -->
    <a-cylinder position="0.65 1.16 -0.15" radius="0.11" height="0.2" color="#FFFFFF" open-ended="true"></a-cylinder>
    <a-circle position="0.65 1.06 -0.15" radius="0.11" rotation="-90 0 0" color="#ECECEC"></a-circle>
    <a-torus position="0.80 1.16 -0.15" radius="0.055" radius-tubular="0.012" rotation="0 0 90" color="#FFFFFF"></a-torus>

    <!-- Cup 2 -->
    <a-cylinder position="0.95 1.16 0.18" radius="0.11" height="0.2" color="#FFF8DC" open-ended="true"></a-cylinder>
    <a-circle position="0.95 1.06 0.18" radius="0.11" rotation="-90 0 0" color="#EBDCB8"></a-circle>
    <a-torus position="1.10 1.16 0.18" radius="0.055" radius-tubular="0.012" rotation="0 0 90" color="#FFF8DC"></a-torus>

    <!-- Extra decoration -->
    <a-box position="-0.9 1.12 0.25" width="0.38" height="0.04" depth="0.28" color="#E7CFA3"></a-box>
    <a-cone position="-0.9 1.3 0.25" radius-bottom="0.08" radius-top="0.01" height="0.26" color="#3E8F4A"></a-cone>

    <a-entity position="0 1.7 4.2">
      <a-camera
        look-controls="pointerLockEnabled: false; reverseMouseDrag: false"
        wasd-controls="acceleration: 30"
        wheel-zoom="min: 1.4; max: 8; speed: 0.002">
      </a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
